# IC3Net adaptation; full MAIL protocol has NOT been verified.
env: ic3_traffic
reward_scope: team
use_agent_active: True
use_agent_reset: True
env_args:
  n_agents: 20
  episode_limit: 80
  dim: 18
  reward_aggregation: mean
  difficulty: hard
  vision: 1
  add_rate_min: 0.05
  add_rate_max: 0.05
test_nepisode: 100
test_interval: 10000
learner_log_interval: 1000
runner_log_interval: 1000
log_interval: 10000
t_max: 2000000
