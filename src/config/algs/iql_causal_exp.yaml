# Causal sender routing + exponential backbone. Pursuit/Battle, auxiliary IQL.
action_selector: epsilon_greedy
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 500000
evaluation_epsilon: 0.0
runner: episode
buffer_size: 5000
target_update_interval_or_tau: 200
mac: causal_exp_mac
agent: causal_exp
routing_mode: hybrid # hybrid | fixed | adaptive | none
routing_temperature: 1.0
obs_agent_id: False
obs_last_action: False
obs_individual_obs: False
agent_output_type: q
learner: aux_q_learner
aux_coef: 0.1
standardise_returns: False
standardise_rewards: True
double_q: True
use_rnn: True
mixer: null
pos_flag: False
name: iql_causal_exp
